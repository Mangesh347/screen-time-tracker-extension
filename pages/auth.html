<!DOCTYPE html>
<html lang="en" data-theme="auto" data-mode="light" data-m3="expressive" data-surface="welcome">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign in — Screen Time Tracker</title>
<link rel="stylesheet" href="../src/theme.css"/>
<link rel="stylesheet" href="../src/motion.css"/>
<link rel="stylesheet" href="../src/m3-expressive.css"/>
<link rel="stylesheet" href="../src/visual-editorial.css"/>
<link rel="stylesheet" href="../src/auth.css"/>
</head>
<body>
<div class="auth-card">
  <div class="logo-wrap">
    <div class="m3-logo-wrap stt-logo-wrap" id="auth-logo" aria-hidden="true"><img class="m3-logo stt-logo" src="../icons/icon48.png" width="44" height="44" alt="" draggable="false" decoding="async" /></div>
    <div>
      <div class="logo-text">Screen Time</div>
      <div class="logo-sub">Create an account or sign in</div>
    </div>
  </div>
  <p class="auth-lead">Use Google or your email — both unlock sync, Community, and Pro checkout.</p>

  <div class="auth-tabs" role="tablist">
    <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true">Sign in</button>
    <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false">Sign up</button>
  </div>

  <div id="msg-err" class="msg-box err" role="alert"><span id="msg-err-text"></span></div>
  <div id="msg-ok" class="msg-box ok" role="status"><span id="msg-ok-text"></span></div>

  <button type="button" class="btn-google" id="btn-google" aria-label="Continue with Google">
    <svg class="google-g" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      <path fill="none" d="M0 0h48v48H0z"/>
    </svg>
    <span>Continue with Google</span>
  </button>

  <div class="divider">or email &amp; password</div>

  <div id="email-panel" class="email-panel">
    <form id="form-login">
      <div class="form-group">
        <label class="form-label" for="l-email">Email</label>
        <input class="form-input" id="l-email" type="email" autocomplete="username" required placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="l-pwd">Password</label>
        <div class="pw-wrap">
          <input class="form-input" id="l-pwd" type="password" autocomplete="current-password" required placeholder="Your password"/>
          <button type="button" class="pw-toggle" id="l-eye" aria-label="Show password"></button>
        </div>
      </div>
      <button class="btn-submit" id="l-submit" type="submit">Sign in with email</button>
    </form>

    <form id="form-signup" style="display:none">
      <div class="form-group">
        <label class="form-label" for="s-name">Name</label>
        <input class="form-input" id="s-name" type="text" autocomplete="name" required placeholder="Display name"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="s-email">Email</label>
        <input class="form-input" id="s-email" type="email" autocomplete="email" required placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="s-region">Country / region</label>
        <select class="form-select" id="s-region" required>
          <option value="">Select…</option>
          <option value="in">India</option>
          <option value="us">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="eu">Europe</option>
          <option value="sea">SE Asia</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="s-pwd">Password</label>
        <div class="pw-wrap">
          <input class="form-input" id="s-pwd" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"/>
          <button type="button" class="pw-toggle" id="s-eye" aria-label="Show password"></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="s-pwd2">Confirm password</label>
        <div class="pw-wrap">
          <input class="form-input" id="s-pwd2" type="password" autocomplete="new-password" required minlength="6" placeholder="Repeat password"/>
          <button type="button" class="pw-toggle" id="s-eye2" aria-label="Show password"></button>
        </div>
      </div>
      <button class="btn-submit" id="s-submit" type="submit">Create account</button>
      <p class="auth-email-note">We’ll create your account with this email. Use the same email at checkout for Pro.</p>
    </form>
  </div>

  <p class="auth-hint">Free account · syncs Focus Score, streaks &amp; leaderboard</p>
  <button type="button" class="btn-guest" id="btn-guest">Continue as guest (local only)</button>
</div>
<script type="module" src="../src/auth.js"></script>
</body>
</html>
